# The tool catalogue: images celln knows how to lend, pinned by digest.
#
# Every entry is immutable. A tag would let what a cell is lent change without
# celln changing, so refreshing these is a code change with a diff and a review,
# not something that happens silently at pull time.
#
# `.github/workflows/tool-digests.yml` re-resolves each tag and opens a PR when
# upstream moves, so the pins stay current without ever being implicit.
#
# ── Adding a tool ────────────────────────────────────────────────────────────
#
# 1. Pick the smallest image that carries the tool and its dependencies. A
#    distribution that happens to include it is the wrong answer: `image pull`
#    refuses anything over 512 MiB, and a cell lends what you name here to
#    every spec that uses it. If the tool is *static*, it does not belong in the
#    catalogue at all — a spec can lend it directly with `path`.
#
# 2. Resolve the tag to a digest:
#
#      skopeo inspect --format '{{.Digest}}' docker://docker.io/library/NAME:TAG
#
# 3. Add an entry below. `tag` is recorded only so CI can re-resolve it; `ref`
#    is the pin that is actually pulled. `default = true` means `celln setup`
#    materialises it, so reserve that for tools most people want.
#
#    A tool that can run a program a model wrote also declares `language` and
#    `code_flag` — the flag it takes that program on. That is what makes it
#    usable with `celln agent --tool NAME`; without both, that command refuses.
#    A compiler has no such flag and should not claim one.
#
# 4. Find the exec paths *inside* the image, without mounting it:
#
#      celln image pull NAME@sha256:...
#      debugfs -R "ls -l /usr/bin" ~/.celln/images/sha256_....ext2
#
# 5. Verify it end to end, then commit the pin with the evidence:
#
#      celln image spec NAME > /tmp/t.toml && celln run /tmp/t.toml
#
# `cargo test -p celln-cli --lib catalogue` checks that every entry is
# digest-pinned, uniquely named, and declares absolute paths.

[[image]]
name = "python"
tag = "docker.io/library/python:3.12-slim"
ref = "docker.io/library/python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36"
about = "CPython 3.12 with its own OpenSSL, sqlite and glibc"
default = true
provides = [
  { alias = "/usr/bin/python", exec = "/usr/local/bin/python3.12", interpreter = true, language = "Python", code_flag = "-c" },
  { alias = "/bin/sh", exec = "/bin/dash", interpreter = true, language = "POSIX shell", code_flag = "-c" },
]

[[image]]
name = "curl"
tag = "docker.io/curlimages/curl:latest"
ref = "docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13"
about = "curl and its TLS stack, musl-linked"
default = true
provides = [
  { alias = "/usr/bin/curl", exec = "/usr/bin/curl" },
]
