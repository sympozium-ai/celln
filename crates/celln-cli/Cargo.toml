[package]
name = "celln-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "celln — run agents in hardware-isolated cells."
readme = "../../README.md"

[[bin]]
name = "celln"
path = "src/main.rs"

[dependencies]
celln-control.workspace = true
celln-spec.workspace = true
celln-manifest.workspace = true
celln-store.workspace = true
celln-assay.workspace = true
celln-forge.workspace = true
celln-pilot.workspace = true
celln-warden.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
is-terminal.workspace = true
toml.workspace = true
tempfile.workspace = true
zeroize = "=1.8.1"
sha2 = "0.10"
ed25519-dalek = "=2.1.1"
base64 = "=0.22.1"
jsonschema = { version = "=0.18.3", default-features = false, features = ["draft202012"] }

[dev-dependencies]
tempfile.workspace = true
flate2 = "=1.0.35"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The real backend only exists on Linux, and only there is it wanted. Everywhere
# else `celln` still validates specs and runs the mock proof, and says so rather
# than pretending.
[target.'cfg(target_os = "linux")'.dependencies]
celln-warden = { workspace = true, features = ["kvm"] }
