[package]
name = "celln-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "celln — run agents in hardware-isolated cells."

[[bin]]
name = "celln"
path = "src/main.rs"

[dependencies]
celln-spec = { version = "0.3.0", path = "../celln-spec" }
celln-manifest = { version = "0.3.0", path = "../celln-manifest" }
celln-store = { version = "0.3.0", path = "../celln-store" }
celln-assay = { version = "0.3.0", path = "../celln-assay" }
celln-forge = { version = "0.3.0", path = "../celln-forge" }
celln-pilot = { version = "0.3.0", path = "../celln-pilot" }
celln-warden = { version = "0.3.0", path = "../celln-warden" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
is-terminal.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The real backend only exists on Linux, and only there is it wanted. Everywhere
# else `nous` still validates specs and runs the mock proof, and says so rather
# than pretending.
[target.'cfg(target_os = "linux")'.dependencies]
celln-warden = { version = "0.3.0", path = "../celln-warden", features = ["kvm"] }
