[package]
name = "celln-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "celln — run agents in hardware-isolated cells."

[[bin]]
name = "celln"
path = "src/main.rs"

[dependencies]
nous-spec = { version = "0.3.0", path = "../nous-spec" }
nous-manifest = { version = "0.3.0", path = "../nous-manifest" }
nous-store = { version = "0.3.0", path = "../nous-store" }
assay = { version = "0.3.0", path = "../assay" }
forge = { version = "0.3.0", path = "../forge" }
pilot = { version = "0.3.0", path = "../pilot" }
warden = { version = "0.3.0", path = "../warden" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
is-terminal.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The real backend only exists on Linux, and only there is it wanted. Everywhere
# else `nous` still validates specs and runs the mock proof, and says so rather
# than pretending.
[target.'cfg(target_os = "linux")'.dependencies]
warden = { version = "0.3.0", path = "../warden", features = ["kvm"] }
