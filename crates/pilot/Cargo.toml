[package]
name = "pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-cell supervisor: exec-by-hash, taint lanes, structured explain."

[features]
# Build the real-KVM demo binary (`nous-demo-kvm`). Needs /dev/kvm to run.
kvm = ["warden/kvm"]

[[bin]]
name = "nous-pilot"
path = "src/guest.rs"

[[bin]]
name = "pilot-fetch"
path = "src/fetch.rs"

[[bin]]
name = "nous-demo"
path = "src/demo.rs"

[[bin]]
name = "nous-demo-kvm"
path = "src/demo_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "nous-bench-kvm"
path = "src/bench_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "nous-boot-kvm"
path = "src/boot_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "nous-fetch-proof"
path = "src/fetch_proof.rs"
required-features = ["kvm"]

[lib]
name = "pilot"
path = "src/lib.rs"

[dependencies]
nous-manifest = { path = "../nous-manifest" }
nous-store = { path = "../nous-store" }
assay = { path = "../assay" }
warden = { path = "../warden" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
