[package]
name = "celln-assay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fleet daemon: store, manifests, tiered resolution. Where the distro lives."

[[bin]]
name = "assay"
path = "src/main.rs"

[lib]
name = "assay"
path = "src/lib.rs"

[dependencies]
celln-manifest = { version = "0.3.0", path = "../celln-manifest" }
celln-forge = { version = "0.3.0", path = "../celln-forge" }
celln-store = { version = "0.3.0", path = "../celln-store" }
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
