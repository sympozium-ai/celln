[package]
name = "celln-pilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-cell supervisor: exec-by-hash, taint lanes, structured explain."

[features]
# Build the real-KVM demo binary (`celln-demo-kvm`). Needs /dev/kvm to run.
kvm = ["celln-warden/kvm"]

[[bin]]
name = "celln-pilot"
path = "src/guest.rs"

[[bin]]
name = "pilot-fetch"
path = "src/fetch.rs"

[[bin]]
name = "celln-demo"
path = "src/demo.rs"

[[bin]]
name = "celln-demo-kvm"
path = "src/demo_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "celln-bench-kvm"
path = "src/bench_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "celln-boot-kvm"
path = "src/boot_kvm.rs"
required-features = ["kvm"]

[[bin]]
name = "celln-fetch-proof"
path = "src/fetch_proof.rs"
required-features = ["kvm"]

[lib]
name = "pilot"
path = "src/lib.rs"

[dependencies]
celln-manifest = { version = "0.4.0", path = "../celln-manifest" }
celln-store = { version = "0.4.0", path = "../celln-store" }
celln-assay = { version = "0.4.0", path = "../celln-assay" }
celln-warden = { version = "0.4.0", path = "../celln-warden" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
