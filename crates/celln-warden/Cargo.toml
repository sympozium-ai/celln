[package]
name = "celln-warden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-cell VMM: wraps one microVM, enforces the authority ratchet."

[lib]
name = "warden"

[features]
# Default builds the mock backend so the POC runs on any host (incl. this
# container). The `kvm` feature builds the real backend, which drives a genuine
# microVM via /dev/kvm (bare metal or a VM with nested virt).
default = ["mock"]
mock = []
kvm = ["dep:kvm-ioctls", "dep:kvm-bindings", "dep:libc"]

[dependencies]
celln-manifest = { version = "0.4.0", path = "../celln-manifest" }
thiserror.workspace = true
kvm-ioctls = { workspace = true, optional = true }
kvm-bindings = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
