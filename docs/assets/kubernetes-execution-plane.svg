<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Sympozium Kubernetes execution plane backed by Celln</title><desc id="desc">An AgentRun becomes a Celln execution request, is admitted by a node agent, then warden forks a cell from a warm mote and pilot gates the workload.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#165a47"/></marker><marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44a32"/></marker><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.heading{font-size:14px;font-weight:700;letter-spacing:2px;fill:#5c675f}.title{font-size:18px;font-weight:700;fill:#17221e}.sub{font-size:13px;fill:#5c675f}.tiny{font-size:12px;fill:#5c675f}.box{fill:#fff;stroke:#d9dfd8;stroke-width:1.5}.green{fill:#eff6e7;stroke:#165a47;stroke-width:1.8}.amber{fill:#fff7e8;stroke:#b47420;stroke-width:1.8}.rose{fill:#fff0ee;stroke:#b44a32;stroke-width:1.8}.boundary{fill:none;stroke:#9caea3;stroke-width:1.5;stroke-dasharray:7 5}</style></defs>
<rect width="1200" height="730" fill="#fbfcf9"/><text x="48" y="52" class="title" font-size="28">Sympozium × Kubernetes × Celln</text><text x="48" y="78" class="sub">A control-plane request becomes a sealed cell only after truthful node admission.</text>
<!-- flow arrows behind boxes -->
<path d="M278 203 H350" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 203 H605" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 203 H845" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M948 270 V345" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 430 H755" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 430 H505" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 514 V585" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 634 H735" stroke="#165a47" stroke-width="2" marker-end="url(#arrow)"/><path d="M990 258 C1080 290 1080 420 1000 450" fill="none" stroke="#b44a32" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#warn)"/>
<!-- control plane -->
<rect x="45" y="125" width="1070" height="180" rx="14" class="boundary"/><text x="66" y="151" class="heading">KUBERNETES CONTROL PLANE</text>
<rect x="75" y="170" width="203" height="76" rx="8" class="box"/><text x="94" y="200" class="title">Sympozium AgentRun</text><text x="94" y="222" class="sub">intent + policy</text>
<rect x="350" y="170" width="180" height="76" rx="8" class="green"/><text x="370" y="200" class="title">adapter</text><text x="370" y="222" class="sub">AgentRun → request</text>
<rect x="605" y="160" width="165" height="96" rx="8" class="green"/><text x="625" y="192" class="title">Celln request</text><text x="625" y="214" class="sub">hashes + caps</text><text x="625" y="234" class="sub">celln.dev/v1alpha1</text>
<rect x="845" y="160" width="210" height="96" rx="8" class="box"/><text x="865" y="192" class="title">scheduler / placement</text><text x="865" y="214" class="sub">reported capacity</text><text x="865" y="234" class="sub">not a CRI runtime</text>
<!-- node -->
<rect x="285" y="345" width="795" height="260" rx="14" class="boundary"/><text x="306" y="371" class="heading">KUBERNETES NODE — KIND CONTROL PLANE IN THIS PROTOTYPE</text>
<rect x="835" y="394" width="180" height="75" rx="8" class="green"/><text x="855" y="423" class="title">node agent</text><text x="855" y="445" class="sub">KVM + stores + caps</text>
<rect x="585" y="394" width="170" height="75" rx="8" class="green"/><text x="605" y="423" class="title">warden</text><text x="605" y="445" class="sub">1 VMM : 1 cell</text>
<rect x="335" y="394" width="170" height="75" rx="8" class="green"/><text x="355" y="423" class="title">warm mote</text><text x="355" y="445" class="sub">parked substrate</text>
<rect x="335" y="515" width="170" height="60" rx="8" class="box"/><text x="355" y="540" class="title">signed tool store</text><text x="355" y="560" class="sub">content-addressed bytes</text>
<rect x="735" y="602" width="260" height="72" rx="8" class="green"/><text x="755" y="630" class="title">sealed cell</text><text x="755" y="652" class="sub">pilot: exec-by-hash + lanes</text>
<!-- truthful refusal -->
<rect x="50" y="400" width="190" height="122" rx="8" class="rose"/><text x="70" y="430" class="title">truthful refusal</text><text x="70" y="455" class="sub">stock Kind has KVM</text><text x="70" y="476" class="sub">but no prepared mote</text><text x="70" y="497" class="sub">or tool store</text><text x="70" y="519" class="tiny">→ no_eligible_node</text>
<text x="62" y="689" class="tiny">Green: verified path. Red dashed: explicit refusal path. The filesystem never grants authority; warden and pilot do.</text></svg>
