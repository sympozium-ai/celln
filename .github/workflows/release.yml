name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: require a main-based release tag
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo test --workspace

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Warden's KVM backend serialises x86 vCPU state. Do not publish an
        # ARM64 bundle until that backend has an equivalent, proven ABI.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cargo-zigbuild is the Cargo frontend; it still needs a Zig compiler.
      # Keep it pinned so both release architectures use the same linker.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: build static release bundle
        run: |
          cargo zigbuild --locked --release --target "${{ matrix.target }}" -p celln-cli
          cargo zigbuild --locked --release --target "${{ matrix.target }}" -p celln-pilot \
            --bin celln-pilot --bin pilot-fetch \
            --bin celln-harness-parent --bin celln-harness-turn \
            --bin celln-workspace-read --bin celln-workspace-write --bin celln-https-fetch \
            --bin celln-harness-reference --bin celln-harness-json
      - name: package
        run: |
          target="${{ matrix.target }}"
          bundle="celln-${target}"
          mkdir -p "$bundle/bin" "$bundle/share/celln/pilot"
          cp "target/$target/release/celln" "$bundle/bin/"
          cp "target/$target/release/celln-pilot" "$bundle/share/celln/pilot/"
          cp "target/$target/release/pilot-fetch" "$bundle/share/celln/pilot/"
          for binary in celln-harness-parent celln-harness-turn celln-workspace-read celln-workspace-write celln-https-fetch celln-harness-reference celln-harness-json; do
            cp "target/$target/release/$binary" "$bundle/share/celln/pilot/"
          done
          cp -R scripts guest "$bundle/share/celln/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/share/celln/SOURCE_REVISION"
          for binary in "$bundle/bin/celln" "$bundle"/share/celln/pilot/*; do
            if readelf -l "$binary" | grep -q INTERP; then
              echo "Dynamic interpreter in release binary: $binary" >&2
              exit 1
            fi
          done
          tar -C "$bundle" -czf "$bundle.tar.gz" .
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: celln-${{ matrix.target }}
          path: |
            celln-${{ matrix.target }}.tar.gz
            celln-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install

            A static Linux x86_64 release archive is available.

            ```sh
            brew install sympozium-ai/celln/celln
            ```
      - name: pin the Homebrew formula to the release archive
        id: archive
        run: |
          archive="celln-x86_64-unknown-linux-musl.tar.gz"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: update sympozium-ai/homebrew-celln
        uses: actions/checkout@v4
        with:
          repository: sympozium-ai/homebrew-celln
          path: homebrew-celln
          token: ${{ secrets.HOMEBREW_CELLN_TOKEN }}
      - name: commit formula update
        working-directory: homebrew-celln
        env:
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i \
            -e "s|^  url \".*\"|  url \"$ARCHIVE_URL\"|" \
            -e "s|^  sha256 \"[0-9a-f]*\"|  sha256 \"$ARCHIVE_SHA256\"|" \
            Formula/celln.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/celln.rb
          git diff --cached --quiet || git commit -m "celln ${VERSION}"
          git push

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: celln-x86_64-unknown-linux-musl
          path: dist
      - name: Prepare verified binary image context
        run: |
          cd dist
          sha256sum -c celln-x86_64-unknown-linux-musl.tar.gz.sha256
          mkdir bundle
          tar -xzf celln-x86_64-unknown-linux-musl.tar.gz -C bundle
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dist/bundle
          file: integrations/kubernetes/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sympozium-ai/celln:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/sympozium-ai/celln
            org.opencontainers.image.revision=${{ github.sha }}
