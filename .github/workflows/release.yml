name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: require a main-based release tag
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # Refuse to tag something that does not build and pass.
      - run: cargo test --workspace
      - run: cargo build --release -p celln-cli

      # The public tap installs the immutable source archive for this tag.
      # Pin its digest so Homebrew verifies exactly what it builds.
      - name: pin the formula to this release
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl --fail --location --silent --show-error "$SOURCE_URL" --output celln.tar.gz
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum celln.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: update the formula in-tree
        run: |
          sed -i \
            -e "s|^  url \".*\"|  url \"${{ steps.release.outputs.source_url }}\"|" \
            -e "s|^  sha256 \"[0-9a-f]*\"|  sha256 \"${{ steps.release.outputs.sha256 }}\"|" \
            Formula/celln.rb
          grep -E 'url|sha256' Formula/celln.rb

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/celln
            Formula/celln.rb
          body: |
            ## Install

            ```sh
            brew install sympozium-ai/tap/celln
            ```

            Then:

            ```sh
            celln doctor
            celln spec init > agent.toml
            celln run agent.toml
            ```

            Sealing cells needs Linux with `/dev/kvm`; `celln doctor` reports
            what this machine can do.

            **Formula maintainers:** copy the attached `celln.rb` into the
            public tap. It pins this release's public source archive and digest.
