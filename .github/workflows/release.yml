name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # Refuse to tag something that does not build and pass.
      - run: cargo test --workspace
      - run: cargo build --release -p celln-cli

      # The source repo is private. The tap therefore fetches the signed tag
      # through the caller's SSH Git credentials rather than an unauthenticated
      # GitHub tarball URL. Pin both tag and commit in the formula.
      - name: pin the formula to this release
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: update the formula in-tree
        run: |
          sed -i \
            -e "s|tag:[[:space:]]*\"v[^\"]*\"|tag:      \"${GITHUB_REF_NAME}\"|" \
            -e "s|revision: \"[0-9a-f]*\"|revision: \"${{ steps.release.outputs.revision }}\"|" \
            Formula/cellulose.rb
          grep -E 'url|tag:|revision:' Formula/cellulose.rb

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/celln
            Formula/cellulose.rb
          body: |
            ## Install

            ```sh
            brew install sympozium-ai/tap/cellulose
            ```

            Then:

            ```sh
            celln doctor
            celln spec init > agent.toml
            celln run agent.toml
            ```

            Sealing cells needs Linux with `/dev/kvm`; `celln doctor` reports
            what this machine can do.

            **Formula maintainers:** copy the attached `celln.rb` into the
            private tap. It pins this release's SSH Git tag and commit.
