name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that does not need virtualization. Hardware tests skip rather
  # than fail without /dev/kvm, so this is honest on a normal runner — see the
  # `hardware` job for the part that actually needs a machine.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # The digest refresher runs weekly against a live registry, so without
      # this it would only ever be exercised in production. It stubs skopeo.
      - name: the tool-digest refresher still holds
        run: scripts/refresh-tool-digests.sh --self-test
      # An inter-crate pin left behind at an older version publishes fine and
      # breaks for whoever installs it, so it must not reach main.
      - name: crate versions agree
        run: scripts/release.sh --check
      # The CLI has to work on a machine with no hardware isolation, because
      # most people will meet it there first.
      - name: cli works without /dev/kvm
        run: |
          cargo build -p celln-cli
          BIN=target/debug/celln
          $BIN --version
          $BIN spec init > /tmp/agent.toml
          $BIN spec check /tmp/agent.toml --no-json
          # exit 3 == "cannot seal cells", which is correct here, not a failure.
          # `if` is deliberate: GitHub invokes bash with `-e`, while exit 3
          # correctly means this runner cannot seal cells.
          if $BIN doctor -q; then code=0; else code=$?; fi
          test "$code" -eq 0 -o "$code" -eq 3
          # and the pipe contract holds
          $BIN spec check /tmp/agent.toml --json | jq -e 'select(.event=="spec_ok")' > /dev/null

  # The claims this project exists to make can only be tested on a machine with
  # KVM. Kept separate and allowed to be unavailable, rather than pretending a
  # skipped test is a passing one.
  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: does this runner have /dev/kvm?
        id: kvm
        run: |
          if [ -r /dev/kvm ]; then echo "have=yes" >> "$GITHUB_OUTPUT";
          else echo "have=no" >> "$GITHUB_OUTPUT"; fi
      - name: hardware proofs
        if: steps.kvm.outputs.have == 'yes'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc cpio e2fsprogs
          make guest
          cargo test -p celln-warden --features kvm
          cargo run -p celln-cli -- verify --no-json
          make acceptance-kvm
      - name: no /dev/kvm on this runner
        if: steps.kvm.outputs.have == 'no'
        run: |
          echo "::warning::No /dev/kvm — the hardware proofs did not run."
          echo "Run 'celln verify' on a machine with KVM to check them."
