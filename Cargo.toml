[workspace]
resolver = "2"
members = [
    "crates/celln-manifest",
    "crates/celln-spec",
    "crates/celln-cli",
    "crates/celln-store",
    "crates/celln-assay",
    "crates/celln-forge",
    "crates/celln-pilot",
    "crates/celln-warden",
]

[workspace.package]
version = "0.4.13"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/sympozium-ai/celln"

# Pinned to versions that build on Rust 1.75 (edition 2021).
[workspace.dependencies]
blake3 = "=1.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4.4", features = ["derive", "env"] }
tempfile = "3"
toml = "0.8"
is-terminal = "0.4"
# Real-KVM backend (warden feature `kvm`; Linux with /dev/kvm only).
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
