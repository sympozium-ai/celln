# DaemonSet: installs the Celln host dispatcher on every KVM-capable node.
#
# Runs once per node on startup. The pod copies the celln binary, runtime
# assets, and Rust toolchain to the host filesystem, creates a systemd
# service, and starts it. After installation, the pod sleeps indefinitely
# (10-year sleep) so the DaemonSet serves as a health indicator.
#
# The actual dispatcher runs as a HOST systemd service — NOT in this pod.
# KVM PMEM mappings require bare-metal access.
#
# Requires: privileged access, hostPID, host mounts
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-installer
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-installer
    app.kubernetes.io/part-of: celln
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-installer
    spec:
      hostPID: true
      containers:
      - name: installer
        image: ghcr.io/sympozium-ai/celln-installer:v0.4.13
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CELLN_RUNTIME_DIR
          value: /opt/celln/runtime
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-deepseek-key
              key: DEEPSEEK_API_KEY
              optional: true
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: host-run
          mountPath: /run/systemd
        - name: kvm
          mountPath: /dev/kvm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: host-run
        hostPath:
          path: /run
          type: Directory
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
