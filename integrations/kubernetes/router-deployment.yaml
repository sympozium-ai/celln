# Deployment: stateless Celln router. Forwards actions to the host-level
# Celln dispatcher systemd service. The dispatcher is NOT a Pod — it runs
# directly on the host via systemd (see scripts/setup-host.sh).
#
# Set BACKEND_IP to the IP of the node running the dispatcher:
#   kubectl create configmap celln-router-config -n celln-system \
#     --from-literal=BACKEND_IP=192.168.1.237
# Or edit the args below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: celln
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      containers:
      - name: router
        image: celln-node:dev
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/celln"]
        args:
        - "route"
        - "--listen=0.0.0.0:8787"
        - "--backends=http://HOST_IP:8787"
        - "--token-file=/etc/celln/dispatcher-token/token"
        - "--mode=round-robin"
        ports:
        - name: http
          containerPort: 8787
          protocol: TCP
        env:
        - name: PATH
          value: /usr/local/bin:/usr/bin:/bin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: host-bin
          mountPath: /usr/local/bin
          readOnly: true
        - name: token-vol
          mountPath: /etc/celln/dispatcher-token
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 8787
          initialDelaySeconds: 3
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8787
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: host-bin
        hostPath:
          path: /usr/local/bin
          type: Directory
      - name: token-vol
        secret:
          secretName: celln-dispatcher-token
