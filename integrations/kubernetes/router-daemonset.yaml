# DaemonSet: one Celln router per KVM node.
# Uses the downward API (status.hostIP) to discover the host IP.
# No hardcoded IPs — each pod resolves its own node's IP.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: celln
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      containers:
      - name: router
        image: celln-node:dev
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - "exec /usr/local/bin/celln route --listen 0.0.0.0:8787 --backends http://${NODE_IP}:8787 --token-file /etc/celln/dispatcher-token/token --mode round-robin"
        ports:
        - name: http
          containerPort: 8787
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: host-bin
          mountPath: /usr/local/bin/celln
          readOnly: true
        - name: token-vol
          mountPath: /etc/celln/dispatcher-token
          readOnly: true
        resources:
          requests: {memory: "16Mi", cpu: "10m"}
          limits: {memory: "64Mi", cpu: "200m"}
      volumes:
      - name: host-bin
        hostPath:
          path: /usr/local/bin/celln
          type: File
      - name: token-vol
        hostPath:
          path: /etc/celln/dispatcher-token
          type: Directory
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: celln-router
  namespace: celln-system
spec:
  selector:
    app.kubernetes.io/name: celln-router
  ports:
  - name: http
    port: 8787
    targetPort: 8787
