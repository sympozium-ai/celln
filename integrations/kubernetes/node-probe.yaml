apiVersion: v1
kind: Namespace
metadata:
  name: celln-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: celln-execution-request
  namespace: celln-system
data:
  request.json: |
    {
      "apiVersion": "celln.dev/v1alpha1",
      "id": "sympozium-kind-probe",
      "workload": { "id": "sympozium-agent-run", "caller": "sympozium:sympozium-system/kind-probe" },
      "mote": { "hash": "blake3:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" },
      "tools": [],
      "capabilities": { "workspace": "none", "egress": [], "timeoutMs": 30000, "memoryBytes": 268435456, "outputBytes": 65536 },
      "execution": { "lane": "agent", "requireHardwareIsolation": true }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-node-probe
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node-probe
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-node-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-node-probe
    spec:
      hostPID: false
      containers:
      - name: node-agent
        image: celln-node:dev
        imagePullPolicy: Never
        command: ["/bin/sh", "-ec"]
        args:
        - |
          while true; do
            celln node probe --node-name="$NODE_NAME" --mote-store=/var/lib/celln/motes --tool-store=/var/lib/celln/tools --max-cells=1 --memory-bytes=268435456
            sleep 30
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: kvm
          mountPath: /dev/kvm
        - name: motes
          mountPath: /var/lib/celln/motes
          readOnly: true
        - name: tools
          mountPath: /var/lib/celln/tools
          readOnly: true
        - name: request
          mountPath: /requests
          readOnly: true
      volumes:
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      - name: motes
        hostPath:
          path: /var/lib/celln/motes
          type: DirectoryOrCreate
      - name: tools
        hostPath:
          path: /var/lib/celln/tools
          type: DirectoryOrCreate
      - name: request
        configMap:
          name: celln-execution-request
